# Live2D角色配置
#
# 每个角色可选配 interactions 段定制交互动效（全部缺省时按骨名自动探测，一般无需配置；
# 默认数值取自官方资源包解包的 SpineDragIK 参数， bone 缺省自动探测 Touch_Eye/Touch_Point 等）：
#   interactions:
#     # 视线跟随：按住拖动时角色看向触点，伴随 Look_01_M 表情；false 可禁用
#     gaze: { bone: Touch_Eye, smoothTime: 0.15, minX: -48.1, maxX: 79.0, minY: -57.2, maxY: 98.3 }
#     # 摸头：长按头部区域触发，头部跟随手指；false 可禁用
#     pat: { bone: Touch_Point, smoothTime: 0.1, minX: -9.6, maxX: 13.5, minY: -33.9, maxY: 32.6 }
#     # 捏脸/特殊骨骼拖拽；false 禁用，数组则覆盖自动探测结果（默认自动探测 Face_IK/Neck_IK/breast_* 等）
#     dragBones:
#       - { bone: breast_01L, radius: 120, range: 30, smoothTime: 0.08 }
#       # 面部家族骨骼的命中判定默认在面部锚点；可用 anchor 自定义判定骨（如 { bone: Face_IK, anchor: face, radius: 170 }）
#       # 也可带动画链（如 aris 的 HandFollow）：{ bone: HandFollow, radius: 180, clips: { start: HandFollow_01_M, chain: HandFollow_02_M, end: HandFollowEnd_01_M } }
#
# bone 为骨骼名；minX/maxX/minY/maxY 为拖拽钳制范围（骨架单位，相对基准位置的偏移，可用 range 做对称简写）；
# radius 为按下命中半径；smoothTime 为平滑时间（秒，越小越跟手）
#
# 台词气泡默认自动跟随嘴/脸骨骼（无需配置）；可选：
#   dialogueDisplay:
#     mode: auto          # auto（默认）| manual（用 x/y/position 手动定位）
#     bone: mouth         # 覆盖锚点骨骼名
#     offsetX: 0          # 像素微调
#     offsetY: -32
#     side: auto          # auto | left | right
memorialLobbies:
  # 角色1 - Aris(Battle)
  - name: Aris(Battle)
    # Live2D模型文件路径
    path: '/l2d/aris_battle/'
    # 骨骼动画文件
    skel: 'CH0334_home.skel'
    # 纹理图集文件
    atlas: 'CH0334_home.atlas'
    # 角色在屏幕中的水平位置偏移（0-1之间）
    offset: 0.5
    # 台词气泡默认自动跟随嘴/脸骨骼；可选 dialogueDisplay: { offsetY: -40, side: auto, bone: mouth }
    dialogueDisplay:
      mode: auto # auto（默认）| manual（用 x/y/position 手动定位）
      side: right # auto | left | right
      offsetX: 40
      offsetY: 40

  # 角色2 - Kei
  - name: Kei
    # Live2D模型文件路径
    path: '/l2d/kei/'
    # 骨骼动画文件
    skel: 'CH0335_home.skel'
    # 纹理图集文件
    atlas: 'CH0335_home.atlas'
    # 角色在屏幕中的水平位置偏移（0-1之间）
    offset: 0.62
    dialogueDisplay:
      mode: auto
      side: right
      offsetX: 40
      offsetY: 40

  # 角色3 - Hina
  - name: Hina_swimsuit
    # Live2D模型文件路径
    path: '/l2d/hina_swimsuit/'
    # 骨骼动画文件
    skel: 'CH0063_home.skel'
    # 纹理图集文件
    atlas: 'CH0063_home.atlas'
    # 角色在屏幕中的水平位置偏移（0-1之间）
    offset: 0.68
    dialogueDisplay:
      mode: auto
      side: left
      offsetX: -100
      offsetY: 40

