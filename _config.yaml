# 基础配置文件（所有语言通用）
# Website Basic Configuration

# 网站标题 - 浏览器标签页显示的标题
title: Fish Archive

# 网站描述 - 用于搜索引擎优化和社交媒体分享
description: A personal homepage in Blue Archive style.

# 网站图标路径 - 浏览器标签页显示的小图标
favicon: /favicon144.png

# 网站作者姓名
author: Yuzifu

# 网站关键词 - 用于搜索引擎优化，逗号分隔
keywords: 'Blue Archive, 小鱼yuzifu, Personal Homepage'

# 站点规范地址 - 用于拼接 og:image/og:url/canonical 的绝对 URL（社交分享卡片要求绝对地址），
# 留空则 og:url/canonical 不输出、og:image 退回相对路径
url: 'https://yzf.moe'

# ICP备案号 - 中国大陆备案信息，留空表示未备案
ICP: ''
# 公安备案号 - 中国大陆网站备案信息，留空表示未备案
gongan: ''

# PWA配置 - 渐进式Web应用配置
manifest:
  # PWA应用完整名称
  name: Fish Archive

  # PWA应用简短名称 - 用于桌面显示
  short_name: Fish Archive

  # PWA应用描述
  description: A personal homepage in Blue Archive style.

  # PWA主题颜色 - 影响浏览器UI颜色
  theme_color: '#128AFA'

  # PWA启动URL - 应用启动时打开的页面
  start_url: /

  # PWA应用唯一标识符
  id: Homepage

  # PWA显示模式 - standalone 安装后以独立窗口打开（非浏览器标签页）
  display: standalone

  # PWA图标配置
  icons:
    # 大尺寸图标 - 用于桌面安装
    - src: /favicon512.png
      sizes: 512x512
      purpose: any maskable

    # 小尺寸图标 - 用于移动设备
    - src: /favicon144.png
      sizes: 144x144

# 个人游戏等级信息
level: 90 # 当前等级
exp: 8382 # 当前经验值
nextExp: 8381 # 升级所需经验值
gold: 11451419 # 信用点初始值（首次访问后由本地「陪伴时长」累计接管）
pyroxene: 24000 # 青辉石初始值（首次访问后由本地「每日签到」累计接管）

# Iconfont JS（默认用仓库内置 public/js/iconfont.js；可改为 iconfont.cn 自建项目的 JS 链接）
iconfont: /js/iconfont.js

# 底部项目展示区域 - 显示相关项目链接
