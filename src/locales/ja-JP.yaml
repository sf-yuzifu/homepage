# 思い出ロビーキャラクター表示名翻訳
memorialLobbies:
  - name: アリス（臨戦）
  - name: キー
  - name: ヒナ（水着）

# アリス（臨戦）
memorialLobbies[0]:
  voice:
    CH0334_MemorialLobby_1_1: えへへ。先生、惊きましたか？
    CH0334_MemorialLobby_1_2: 先生と一绪に、この夜空を见たくて……呼んだんです。
    CH0334_MemorialLobby_2_1: とても……绮丽ですね。
    CH0334_MemorialLobby_2_2: アリスの世界にも、まだ行ったことのない世界にも……きっとこんな绮丽なものがたくさんあると思うんです。
    CH0334_MemorialLobby_3_1: でも……不思议です。
    CH0334_MemorialLobby_3_2: 世界って、こんなに绮丽なのに……どうして人は争うんでしょう？
    CH0334_MemorialLobby_4: あの星空みたいに、この世界は、みんなで分け合っても大丈夫なくらい美しいものであふれているのに……。
    CH0334_MemorialLobby_5: ……やっぱり、アリスにはまだわかりません。

# キー
memorialLobbies[1]:
  voice:
    CH0335_MemorialLobby_1_1: 心配しないでください。
    CH0335_MemorialLobby_1_2: 私が消えることはありません。
    CH0335_MemorialLobby_2_1: むしろ、その逆ですね。
    CH0335_MemorialLobby_2_2: 私は、どんな手を使ってでも生き残ってやるつもりですから。
    CH0335_MemorialLobby_3_1: 先生がこの世界を見捨てないというのなら。
    CH0335_MemorialLobby_3_2: 私だって最後まで、絶対に諦めたりしません。
    CH0335_MemorialLobby_4_1: だから大丈夫……絶対、大丈夫です。
    CH0335_MemorialLobby_4_2: 私はずっとここにいます。
    CH0335_MemorialLobby_5_1: ここだけの話ですけど……私は――
    CH0335_MemorialLobby_5_2: 先生のこと、嫌いじゃありませんから。

# ヒナ水着版キャラクター音声対話翻訳
memorialLobbies[2]:
  voice:
    CH0063_MemorialLobby_1_1: 何でみんな、そんなに海が好きなんだろう……って、いつもそう思ってた。
    CH0063_MemorialLobby_1_2: みんなは楽しそうだけど、私はどうしても好きになれなくて…
    CH0063_MemorialLobby_2_1: 水の中はよく見えないし、足が付がないと不安だし……
    CH0063_MemorialLobby_2_2: 先生も、そう思ったことない？
    CH0063_MemorialLobby_3_1: 特に夜の海は、まるで暗闇みたいに不気味で……
    CH0063_MemorialLobby_3_2: 見てるだけで吸い込まれそうで、好きになれなかったけど……
    CH0063_MemorialLobby_4_1: でも……今は、みんなの気持ちが少しだけ分かった気がする。
    CH0063_MemorialLobby_4_2: 海って、こんなに綺麗だったのね。
    CH0063_MemorialLobby_5_1: 不思議……今まで、こんな風に思ったことなかったのに。
    CH0063_MemorialLobby_5_2: ありがとう，先生。一緒にいてくれて…… 色んなことを，教えてくれて。

